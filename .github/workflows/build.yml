name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true

          echo "--- 已安装组件 ---"
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true

      - name: 编译 debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LocalMusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Release（公开下载直链）
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LocalMusic-v1.0.apk
          # 先确保 release 存在，再用 --clobber 覆盖同名资产。
          # 不要用「删掉再建」：删除与创建之间容易出现旧资产残留。
          gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "本地音乐播放器 v1.0" \
              --notes "极简本地音乐播放器。只能播放手机里的本地音频，一个「定时关闭 2 小时」按钮，无联网权限。安装前需在系统设置里允许「安装未知来源应用」。" \
              --latest
          gh release upload latest LocalMusic-v1.0.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: 校验发布资产
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL_SUM=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)
          REMOTE_SUM=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
            --jq '.assets[] | select(.name=="LocalMusic-v1.0.apk") | .digest' | sed 's/^sha256://')
          echo "本地: $LOCAL_SUM"
          echo "远端: $REMOTE_SUM"
          if [ "$LOCAL_SUM" != "$REMOTE_SUM" ]; then
            echo "::error::Release 资产与本次构建不一致，上传未生效"
            exit 1
          fi
